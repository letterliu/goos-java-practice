services:
  openfire:
    image: nasqueron/openfire:4.7.4
    ports:
      - "9090:9090"   # admin console（跑 setup wizard 用）
      - "5222:5222"   # 測試會用到的 XMPP client port
      - "7070:7070"   # unencrypted BOSH / WebSocket（ws://.../ws/）
      - "7443:7443"   # encrypted BOSH / WebSocket（wss://.../ws/）
    environment:
      - "OPENFIRE_ADMIN_PASSWORD=admin"
    volumes:
      - openfire-data:/var/lib/openfire

  toolbox:
    build:
      context: ..
      dockerfile: docker/toolbox.Dockerfile
    volumes:
      - ..:/app
    working_dir: /app
    # 用 docker-init（tini）當 PID 1 回收孤兒 process；否則 PID 1 是 sleep，
    # xvfb-run 結束時 kill 掉但沒 wait 的 Xvfb 會一直留成 zombie
    init: true
    network_mode: "service:openfire"
    command: ["sleep", "infinity"]

volumes:
  openfire-data: